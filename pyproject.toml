[project]
name = "montage"
version = "0.1.0"
description = "MontageStudio slice 1: scene_plan.json validator and FFmpeg renderer"
requires-python = ">=3.10"
dependencies = []  # stdlib only; needs ffmpeg + ffprobe on PATH

[project.scripts]
montage = "montage.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
